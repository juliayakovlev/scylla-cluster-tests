# Experiment: run 15 shards on z4d-highmem-16 (8 cores x 2 threads).
# The default setup (perftune auto_detect_irq_mask) keeps core 0 (CPUs 0 and 8) for IRQs and runs 14 shards.
# With this file deployed before the first Scylla start, scylla_prepare derives irq_cpu_mask as CPU 0 only.
# Use with: SCT_SCYLLA_D_OVERRIDES_FILES=["configurations/gce/scylla.d/z4d-highmem-16-15-shards/cpuset.conf"]
CPUSET="--cpuset 1-15 "
