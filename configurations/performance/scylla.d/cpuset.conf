# Uploaded to /etc/scylla.d/cpuset.conf by SCT (scylla_d_overrides_files), overriding the value
# generated by scylla_sysconfig_setup on the image. Valid for 16 vCPU DB instances (i4i.4xlarge,
# i8g.4xlarge): cpu 0 is left to IRQs, cpus 14-15 are kept out of the Scylla cpuset on purpose.
CPUSET="--cpuset 1-13"
